name: Bug report
description: Report a problem in API Request
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Application version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where does the problem occur?
      options:
        - Desktop app
        - Local web
        - Self-hosted web
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and browser
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials and private request data before posting.
