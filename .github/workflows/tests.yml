name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:testpass@127.0.0.1:5432/apirequest
      DATA_ENCRYPTION_KEY: "12345678901234567890123456789012"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: cp .env.example .env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Test desktop release validation
        run: node --test desktop/release-version.test.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace dependencies and generate GraphQL types
        run: pnpm ci:prepare

      - name: Run tests
        run: pnpm --workspace-concurrency=1 -r do-test --maxWorkers=2
