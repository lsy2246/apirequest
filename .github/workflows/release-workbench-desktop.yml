name: Desktop CD

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node desktop/release-version.cjs

  build:
    needs: version
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            bundle: nsis
            executable: desktop/src-tauri/target/debug/apirequest-native.exe
            installer: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-arm64
            runner: macos-15
            bundle: dmg
            executable: desktop/src-tauri/target/debug/apirequest-native
            installer: desktop/src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust
        run: rustup default stable
      - name: Install workbench dependencies
        run: pnpm --filter '@apirequest/selfhost-web...' install --frozen-lockfile --ignore-scripts
      - name: Prepare capture engine
        run: python desktop/prepare-capture.py
      - name: Build native frontend
        run: pnpm --dir desktop run prepare:native
      - name: Run targeted workbench tests
        run: |
          cargo test --locked --manifest-path desktop/workbench-core/Cargo.toml
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml capture::tests::captures_real_http_through_packaged_engine
          pnpm --filter '@apirequest/common' exec vitest run src/helpers/curl/__tests__/curlparser.spec.js src/helpers/local-workspace/__tests__/collections.spec.ts src/services/persistence/__tests__/index.spec.ts src/helpers/load-test/__tests__/runner.spec.ts
      - name: Check native startup and persisted data
        env:
          NATIVE_EXECUTABLE: ${{ matrix.executable }}
        shell: bash
        run: |
          node --check desktop/src-tauri/tests/smoke.js
          node --check desktop/src-tauri/tests/mock-smoke.js
          cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
          python desktop/src-tauri/tests/smoke.py "$NATIVE_EXECUTABLE" --capture-only
          python desktop/src-tauri/tests/smoke.py "$NATIVE_EXECUTABLE"
      - name: Package installer
        working-directory: desktop
        # Windows needs its native Perl; Git Bash selects an incomplete MSYS Perl.
        run: npm exec --yes --package=@tauri-apps/cli@2.11.3 -- tauri build --ci --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: workbench-desktop-v${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        shell: bash
        run: |
          tag="v${VERSION}"
          files=(installers/*)
          [[ "${#files[@]}" -eq 2 ]] || { echo 'Expected two installers'; exit 1; }
          existing_commit=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')
          if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
            echo 'Version tag points to a different commit'
            exit 1
          fi
          if gh release view "$tag" --json isDraft,targetCommitish > release.json 2>/dev/null; then
            [[ $(jq -r .targetCommitish release.json) == "$RELEASE_COMMIT" ]] || exit 1
            [[ $(jq -r .isDraft release.json) == true ]] || exit 0
          else
            gh release create "$tag" --target "$RELEASE_COMMIT" --title "API Request $VERSION" --generate-notes --draft
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false
