<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <script>
      globalThis.import_meta_env = JSON.parse('"import_meta_env_placeholder"')
    </script>
    <title>API Request • API 工作台</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>
  <body>
    <div id="app">
      <style>
        .app-startup {
          min-height: 100vh;
          display: grid;
          place-content: center;
          gap: 16px;
          margin: 0;
          padding: 24px;
          box-sizing: border-box;
          background: #f8fafc;
          color: #334155;
          font: 15px/1.6 system-ui, sans-serif;
          text-align: center;
        }
        .app-startup h1 { margin: 0; font-size: 20px; }
        .app-startup p { margin: 0; }
        .app-startup button {
          justify-self: center;
          padding: 8px 20px;
          border: 1px solid currentColor;
          border-radius: 8px;
          background: transparent;
          color: inherit;
          font: inherit;
          cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
          .app-startup { background: #191c24; color: #e2e8f0; }
        }
      </style>
      <main class="app-startup" role="status" aria-live="polite">
        <h1>API Request</h1>
        <p data-startup-message>正在加载工作区，请稍候…</p>
        <button type="button" onclick="location.reload()">刷新重试</button>
        <noscript>请启用 JavaScript 后重新打开工作区。</noscript>
      </main>
    </div>
    <script>
      // Browser compatibility globals
      window.global = window
    </script>
    <script type="module">
      import { Buffer } from "buffer"
      import process from "process"

      window.Buffer = Buffer
      window.process = process
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
